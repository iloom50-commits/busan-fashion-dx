        .roadmap-item { background: white; border: 1px solid #e2e8f0; border-radius: 6px; padding: 0.5rem 0.75rem; font-size: 0.75rem; margin-bottom: 0.5rem; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }

        .fade-in { animation: fadeIn 0.25s ease-out; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }

        input:focus, textarea:focus { outline: none; border-color: #16a34a; box-shadow: 0 0 0 3px rgba(22,163,74,0.1); }

const ACCESS_CODE = '2026';
const EXPERT_NAME_KEY = 'dx-expert-name';

// 차트도 본문과 같은 폰트를 쓴다. 지정하지 않으면 Chart.js 기본 폰트로 렌더되어
// 한글만 다른 글꼴로 나온다.
Chart.defaults.font.family = "'Noto Sans KR', sans-serif";

function checkPw() {
    const name = document.getElementById('expert-name').value.trim();
    const code = document.getElementById('pw-input').value.trim();
    const err  = document.getElementById('pw-err');
    if (!name) {
        err.innerText = '진단자 이름을 입력해주세요';
        err.classList.remove('hidden');
        document.getElementById('expert-name').focus();
        return;
    }
    if (code !== ACCESS_CODE) {
        err.innerText = '접속 코드가 올바르지 않습니다';
        err.classList.remove('hidden');
        document.getElementById('pw-input').value = '';
        return;
    }
    state.expertName = name;
    try { localStorage.setItem(EXPERT_NAME_KEY, name); } catch(e) {}
    err.classList.add('hidden');
    document.getElementById('auth-screen').classList.add('hidden');
    render();
}

// 사업자번호: 저장·대조는 숫자 10자리로 정규화, 표시만 하이픈 형식
function normBizNum(v) { return String(v||'').replace(/\D/g,''); }
function fmtBizNum(v) {
    const n = normBizNum(v);
    return n.length===10 ? `${n.slice(0,3)}-${n.slice(3,5)}-${n.slice(5)}` : (v||'-');
}
function tsMillis(t) { return t && t.toMillis ? t.toMillis() : 0; }
function tsText(t) {
    const m = tsMillis(t);
    return m ? new Date(m).toLocaleDateString('ko-KR') : '날짜 미상';
}

// 자가진단 목록 조회 (단일 조건 where — 복합 색인 불필요)
let selfCache = null;
async function fetchSelfList() {
    if (selfCache) return selfCache;
    const snap = await db.collection('diagnoses').where('type','==','self').get();
    selfCache = snap.docs.map(x => ({ id:x.id, ...x.data() }));
    return selfCache;
}

// 완료된 전문가 진단 조회 — 리포트를 다시 뽑기 위한 것
let doneCache = null;
async function fetchDoneList() {
    if (doneCache) return doneCache;
    const snap = await db.collection('diagnoses').where('type','==','expert').get();
    doneCache = snap.docs.map(x => ({ id:x.id, ...x.data() }));
    return doneCache;
}

async function saveDiagnosis() {
    if (state.saved) return;
    state.saved = true;
    const statusEl = document.getElementById('save-status');
    try {
        await db.collection('diagnoses').add({
            type: 'expert',
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            // 대표자·연락처·이메일은 저장하지 않는다 (개인정보 최소화)
            // 근거: docs/superpowers/specs/2026-08-13-privacy-minimization-design.md
            company: state.info.comp,
            emp: state.info.emp || '',
            bizNum: normBizNum(state.info.biz),
            expertName: state.expertName || '',   // 진단 수행자 기록 (과업 산출물 요건)
            selfRef: state.selfRef || null,
            selfScores: state.selfScores || null,
            track: state.track,
            gradeLv: state.grade.lv,
            gradeTxt: state.grade.txt,
            totalScore: Object.values(state.grade.scores).reduce((a,b)=>a+b,0),
            scores: state.grade.scores,
            causes: state.causes,
            comments: state.comments,
            solutions: state.solutions,
            roadmap: { short: state.roadmap.short, mid: state.roadmap.mid, long: state.roadmap.long },
            opinion: state.opinion
        });
        clearDraft();  // 저장 완료 — 임시본을 남겨두면 다음 로그인 때 복원 안내가 뜬다
        if (statusEl) statusEl.innerHTML = '<span class="text-green-600 text-xs font-bold">✓ 진단 결과가 저장되었습니다</span>';
    } catch(e) {
        state.saved = false;
        if (statusEl) statusEl.innerHTML = '<span class="text-red-400 text-xs">⚠ 저장 실패 — 리포트를 PDF로 출력해주세요</span>';
    }
}

    step:'lookup', track:null, expertName:'', reopened:false,
    info:{}, scores:{}, causes:{}, solutions:{}, comments:{},

    opinion:'', grade:null, saved:false,

// ===== 작성 중 임시저장 (브라우저 로컬) =====
// 현장에서 새로고침·배터리 방전으로 입력이 사라지는 것을 막는다.
// 서버가 아닌 localStorage를 쓰므로 현장 통신 상태와 무관하게 동작한다.
// 현장 사진은 state에 담기지 않으므로 복원 대상이 아니다 — 이어서 작성 시 다시 첨부한다.
const DRAFT_KEY = 'dx-expert-draft';

function saveDraft() {
    if (state.step === 'lookup' || state.saved) return;
    // 사진(base64)은 용량이 커서 localStorage 한도를 넘길 수 있으므로 제외한다.
    // 이어서 작성할 때 사진은 다시 첨부한다.
    const { photos, ...rest } = state;
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify(rest)); } catch(e) {}
}
function loadDraft() {
    try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch(e) { return null; }
}
function clearDraft() {
    try { localStorage.removeItem(DRAFT_KEY); } catch(e) {}
}

function resumeDraft() {
    const d = loadDraft();
    if (!d) return;
    state = d;
    state.photos = state.photos || {};   // 임시저장에서 제외된 필드
    if (state.info && state.info.comp) {
        document.getElementById('hd-company').innerText = state.info.comp;
        document.getElementById('hd-company').classList.remove('hidden');
    }
    if (state.track) {
        document.getElementById('hd-track').innerText = `Track ${state.track}`;
        document.getElementById('hd-track').classList.remove('hidden');
    }
    render();
}

function discardDraft() { clearDraft(); render(); }

function draftBanner() {
    const d = loadDraft();
    if (!d || !d.info || !d.info.comp) return '';
    const idx = STEPS.findIndex(s => s.s === d.step) + 1;
    return `
    <div id="draft-banner" class="mx-8 mt-5 border-2 border-amber-300 bg-amber-50 rounded-lg p-4 flex items-center gap-3">
        <span class="text-2xl">📝</span>
        <div class="flex-1 min-w-0">
            <p class="font-bold text-amber-900 text-sm">작성 중이던 진단이 있습니다</p>
            <p class="text-xs text-amber-700 mt-0.5">${d.info.comp} · ${idx}/${STEPS.length}단계 · 현장 사진은 다시 첨부해야 합니다</p>
        </div>
        <button onclick="resumeDraft()" class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-lg font-bold text-xs whitespace-nowrap">이어서 작성 →</button>
        <button onclick="discardDraft()" class="text-xs text-gray-400 underline whitespace-nowrap">새로 시작</button>
    </div>`;
}

function updateStepper() {
    const cur = STEPS.findIndex(s => s.s === state.step);
    document.getElementById('stepper-row').innerHTML = STEPS.map((s,i) => `
        <div class="stepper-item ${i<cur?'completed':i===cur?'active':''}">
            <div class="stepper-circle">${i<cur?'✓':i+1}</div>
            <div class="stepper-label">${s.label}</div>
        </div>`).join('');
}

function render() {
    updateStepper();
    const el = document.getElementById('wiz');
    el.className = 'fade-in w-full';
    void el.offsetWidth;
    if      (state.step === 'lookup')             renderLookup(el);
    else if (state.step === 0)                    renderTrack(el);
    else if (state.step === 1)                    renderExpertInfo(el);
    else if (state.step === 2)                    renderPhoto(el);
    else if (state.step >= 3 && state.step <= 8) renderExpertDiag(el);
    else if (state.step === 'roadmap')            renderRoadmap(el);
    else if (state.step === 'opinion')            renderOpinion(el);
    else if (state.step === 'result')             renderResult(el);
    saveDraft();
}

async function loadDoneList() {
    const box = document.getElementById('lk-done');
    if (!box) return;
    box.innerHTML = '<p class="text-xs text-gray-400 py-3">불러오는 중...</p>';
    try {
        const list = (await fetchDoneList()).slice().sort((a,b) => {
            // 본인이 진단한 것을 먼저 보여준다. 이름이 조금 달라도 목록에서 사라지지 않게
            // 타 진단자 것도 함께 표시한다.
            const am = (a.expertName||'') === state.expertName ? 0 : 1;
            const bm = (b.expertName||'') === state.expertName ? 0 : 1;
            return am !== bm ? am - bm : tsMillis(b.timestamp) - tsMillis(a.timestamp);
        });
        document.getElementById('lk-done-count').innerText = `${list.length}건`;
        box.innerHTML = list.length
            ? list.map(d => doneCard(d)).join('')
            : '<p class="text-xs text-gray-400 py-3">완료된 진단이 없습니다.</p>';
    } catch(e) {
        box.innerHTML = `<p class="text-xs text-red-500 py-3">목록 불러오기 실패: ${e.message}</p>`;
    }
}

function doneCard(d) {
    const mine = (d.expertName||'') === state.expertName;
    return `
        <div class="done-card border rounded-lg p-4 mb-2 ${mine?'border-green-300 bg-green-50':'border-gray-200'}"
             data-company="${(d.company||'').replace(/"/g,'')}">

                <div class="min-w-0">
                    <div class="font-bold text-gray-800">${d.company||'-'}${mine?' <span class="text-xs text-green-700">(내 진단)</span>':''}</div>
                    <div class="text-xs text-gray-500 mt-0.5">${d.emp||'-'} · Track ${d.track||'-'} · ${d.gradeTxt||'-'}${d.totalScore!=null?` (${d.totalScore}점)`:''}</div>
                    <div class="text-xs text-gray-400 mt-0.5">진단자 ${d.expertName||'-'} · ${tsText(d.timestamp)}</div>
                </div>
                <button onclick="reopenDone('${d.id}')" class="border-2 border-green-600 text-green-700 hover:bg-green-50 px-4 py-2 rounded-lg font-bold text-xs whitespace-nowrap flex-shrink-0">리포트 열기</button>

// 저장된 전문가 진단을 결과 화면으로 되살린다.
// saved=true로 두어 다시 저장되지 않게 한다 — 열 때마다 기록이 늘면 집계가 어긋난다.
function reopenDone(id) {
    const d = (doneCache||[]).find(x => x.id === id);
    if (!d) return;
    state.info       = { comp:d.company||'', ceo:'', emp:d.emp||'',
                         biz:d.bizNum?fmtBizNum(d.bizNum):'', phone:'', email:'' };
    state.track      = d.track || null;
    state.scores     = d.scores || {};
    state.causes     = d.causes || {};
    state.comments   = d.comments || {};
    state.solutions  = d.solutions || {};
    state.roadmap    = Object.assign({short:[],mid:[],long:[],_built:true}, d.roadmap || {});
    state.opinion    = d.opinion || '';
    state.selfRef    = d.selfRef || null;
    state.selfScores = d.selfScores || null;
    state.photos     = {};              // 사진은 저장하지 않으므로 복원 대상이 아니다
    state.expertName = d.expertName || state.expertName;
    state.saved      = true;            // 재저장 방지
    state.reopened   = true;
    document.getElementById('hd-company').innerText = state.info.comp;
    document.getElementById('hd-company').classList.remove('hidden');
    if (state.track) {
        document.getElementById('hd-track').innerText = `Track ${state.track}`;
        document.getElementById('hd-track').classList.remove('hidden');
    }
    state.step = 'result';
    render();
}

async function loadRecentList() {
    const box = document.getElementById('lk-list');
    if (!box) return;
    box.innerHTML = '<p class="text-xs text-gray-400 py-3">불러오는 중...</p>';
    try {
        const list = (await fetchSelfList()).slice().sort((a,b) => tsMillis(b.timestamp) - tsMillis(a.timestamp));
        document.getElementById('lk-count').innerText = `${list.length}건`;
        box.innerHTML = list.length
            ? list.map(h => selfCard(h, false, false)).join('')
            : '<p class="text-xs text-gray-400 py-3">저장된 자가진단이 없습니다.</p>';
    } catch(e) {
        box.innerHTML = `<p class="text-xs text-red-500 py-3">목록 불러오기 실패: ${e.message}</p>`;
    }
}

function lkMsg(cls, html) { document.getElementById('lk-result').innerHTML =

async function lookupByBizNum() {
    const key = normBizNum(document.getElementById('lk-biznum').value);
    if (key.length !== 10) { lkMsg('border-orange-200 bg-orange-50 text-orange-700','사업자번호를 숫자 10자리로 입력해주세요. (예: 123-45-67890)'); return; }
    lkMsg('border-gray-200 bg-gray-50 text-gray-500','조회 중...');
    try {
        const list = await fetchSelfList();
        renderHits(list.filter(x => normBizNum(x.bizNum) === key), `사업자번호 ${fmtBizNum(key)}`);
    } catch(e) { lkMsg('border-red-200 bg-red-50 text-red-600','조회 실패: '+e.message); }
}

async function lookupByName() {
    const q = document.getElementById('lk-name').value.replace(/\s/g,'');
    if (!q) { lkMsg('border-orange-200 bg-orange-50 text-orange-700','기업명을 입력해주세요.'); return; }
    lkMsg('border-gray-200 bg-gray-50 text-gray-500','검색 중...');
    try {
        const list = await fetchSelfList();
        renderHits(list.filter(x => String(x.company||'').replace(/\s/g,'').includes(q)), `기업명 "${q}"`);
    } catch(e) { lkMsg('border-red-200 bg-red-50 text-red-600','검색 실패: '+e.message); }
}

function renderHits(hits, label) {
    if (!hits.length) {
        lkMsg('border-orange-200 bg-orange-50 text-orange-700',
            `<p class="font-bold mb-1">${label}에 해당하는 자가진단 이력이 없습니다</p>
             <p class="text-xs">기업명으로 다시 찾아보거나, 아래 '자가진단 없이 시작'으로 진행하세요.</p>`);
        return;
    }
    hits.sort((a,b) => tsMillis(b.timestamp) - tsMillis(a.timestamp));
    document.getElementById('lk-result').innerHTML =
        hits.map((h,idx) => selfCard(h, idx===0, idx===0 && hits.length>1)).join('')
        + (hits.length>1 ? `<p class="text-xs text-gray-400 mt-1">${hits.length}건이 조회되었습니다. 최신 결과 사용을 권장합니다.</p>` : '');
}

function applySelf(id) {
    const d = (selfCache||[]).find(x => x.id === id);
    if (!d) return;
    state.selfRef    = id;
    state.selfData   = d;
    state.selfScores = d.scores || null;
    state.info = { comp:d.company||'', ceo:d.ceo||'', emp:d.emp||'',
                   biz:d.bizNum?fmtBizNum(d.bizNum):'', phone:d.phone||'', email:d.email||'' };
    state.track = d.track || null;
    document.getElementById('hd-company').innerText = state.info.comp;
    document.getElementById('hd-company').classList.remove('hidden');
    state.step = 0; render();
}

function setTrack(t) {

    document.getElementById('hd-track').innerText=`Track ${t}`;
    document.getElementById('hd-track').classList.remove('hidden');
    state.step=1; render();

function saveExpertInfo() {
    const comp=document.getElementById('ei-comp').value.trim();
    if(!comp){alert('기업명은 필수입니다.');return;}
    const biz=normBizNum(document.getElementById('ei-biz').value);
    if(biz && biz.length!==10){alert('사업자번호를 숫자 10자리로 입력해주세요.\n(예: 123-45-67890)');return;}
    if(!biz && !confirm('사업자번호 없이 진행하면 이 진단은 자가진단 결과와 연결되지 않습니다.\n계속하시겠습니까?'))return;
    state.info.comp=comp;
    state.info.ceo=document.getElementById('ei-ceo').value.trim();
    state.info.emp=document.getElementById('ei-emp').value.trim();
    state.info.biz=biz?fmtBizNum(biz):'';
    document.getElementById('hd-company').innerText=comp;
    document.getElementById('hd-company').classList.remove('hidden');
    next();
}

function loadPhoto(inp, n) {
    if(!inp.files[0])return;
    const r=new FileReader();
    r.onload=e=>{
        // 스마트폰 사진은 수 MB라 그대로 두면 리포트 인쇄가 느려진다. 긴 변 1200px로 축소.
        const img=new Image();
        img.onload=()=>{
            const max=1200, sc=Math.min(1, max/Math.max(img.width,img.height));
            const cv=document.createElement('canvas');
            cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
            cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
            state.photos[n]=cv.toDataURL('image/jpeg',0.8);
            showPhoto(n);
        };
        img.src=e.target.result;
    };
    r.readAsDataURL(inp.files[0]);
}

function showPhoto(n) {
    const el=document.getElementById(`ph-img-${n}`);
    if(!el||!state.photos[n])return;
    el.src=state.photos[n];
    el.classList.remove('hidden');
    document.getElementById(`ph-lbl-${n}`).classList.add('hidden');
}

// 아래 세 함수는 render()를 거치지 않고 현재 화면만 다시 그리므로
// saveDraft()를 직접 호출해야 입력이 임시저장된다.
function setScore(id, val) {
    state.scores[id]=val;
    renderExpertDiag(document.getElementById('wiz'));
    saveDraft();
}

// 화면을 다시 그리지 않는다. 다시 그리면 입력 중 포커스를 잃는다.
function setComment(areaId, v) {
    state.comments[areaId] = v;
    saveDraft();
}

function toggleCause(areaId, cause) {
    if(!state.causes[areaId])state.causes[areaId]=[];
    const idx=state.causes[areaId].indexOf(cause);
    if(idx===-1)state.causes[areaId].push(cause);
    else        state.causes[areaId].splice(idx,1);
    renderExpertDiag(document.getElementById('wiz'));
    saveDraft();
}

function toggleSolution(areaId, solId) {
    if(!state.solutions[areaId])state.solutions[areaId]=[];
    const idx=state.solutions[areaId].indexOf(solId);
    if(idx===-1)state.solutions[areaId].push(solId);
    else        state.solutions[areaId].splice(idx,1);
    renderExpertDiag(document.getElementById('wiz'));
    saveDraft();
}

function moveRoadmapItem(id, cur) {
    const order=['short','mid','long'];
    const nxt=order[(order.indexOf(cur)+1)%3];
    state.roadmap[cur]=state.roadmap[cur].filter(x=>x!==id);
    state.roadmap[nxt].push(id);
    renderRoadmap(document.getElementById('wiz'));
    saveDraft();
}

function saveOpinion() {
    const op=document.getElementById('inp-opinion').value.trim();
    if(!op){alert('전문가 종합의견을 입력해주세요.');return;}
    state.opinion=op;
    next();
}

function restart() {
    const who = state.expertName;   // 같은 진단자가 이어서 다음 기업을 진단한다
    state = { step:'lookup', track:null, expertName:who, reopened:false,
              info:{}, scores:{}, causes:{}, solutions:{}, comments:{},
              roadmap:{short:[],mid:[],long:[],_built:false}, opinion:'', grade:null, saved:false,
              selfRef:null, selfData:null, selfScores:null, photos:{} };
    selfCache = null;  // 다음 기업 진단 시 최신 목록을 다시 조회
    doneCache = null;
    clearDraft();
    document.getElementById('hd-company').classList.add('hidden');
    document.getElementById('hd-track').classList.add('hidden');
    render();
}

// ===== 네비게이션 =====
function next() {
    if(state.step==='result')return;
    if     (state.step==='lookup')  state.step=0;
    else if(state.step===8)         state.step='roadmap';
    else if(state.step==='roadmap') state.step='opinion';
    else if(state.step==='opinion') state.step='result';
    else                            state.step++;
    render();
}

function prev() {
    if(state.step==='lookup')return;
    if     (state.step===0)         state.step='lookup';
    else if(state.step==='roadmap') state.step=8;
    else if(state.step==='opinion') state.step='roadmap';
    else if(state.step==='result')  state.step='opinion';
    else                            state.step--;
    render();
}

// ===== 차트 =====
// 점수(크기)는 한 색조의 농담으로 표현한다. 흑백 인쇄에서도 농담 차이가 남는다.
const BAR_RAMP = {1:'#bbf7d0', 2:'#86efac', 3:'#4ade80', 4:'#22c55e', 5:'#15803d'};

// 계열색은 팔레트 검증기 통과값 (CVD ΔE 30.3)
const C_SELF = '#2563eb', C_EXPERT = '#16a34a';

function drawCharts(prefix, scoresObj) {
    const labels=DATA.areas.map(a=>a.name);
    const data  =DATA.areas.map(a=>scoresObj[a.id]||0);
    // 리포트 차트는 애니메이션을 끈다. 그리는 도중 이미지로 바꾸면 비어 나온다.
    const anim  =prefix==='rpt'?{duration:0}:{};
    ['radar','bar'].forEach(t=>{const k=`${prefix}-${t}`;if(charts[k]){charts[k].destroy();delete charts[k];}});

    const datasets=[{
        label:'전문가 평가', data,
        borderColor:C_EXPERT, backgroundColor:'rgba(22,163,74,0.10)',
        pointBackgroundColor:C_EXPERT, pointRadius:4, borderWidth:2
    }];
    // 자가진단이 있으면 겹쳐 그린다. 격차가 면적 차이로 드러난다.
    // 점선을 함께 써서 색 없이도 두 계열이 구분되게 한다.
    if (prefix==='rpt' && state.selfScores) datasets.unshift({
        label:'자가진단', data:DATA.areas.map(a=>state.selfScores[a.id]||0),
        borderColor:C_SELF, backgroundColor:'rgba(37,99,235,0.06)',
        pointBackgroundColor:C_SELF, pointRadius:4, borderWidth:2, borderDash:[5,3]
    });

    charts[`${prefix}-radar`]=new Chart(document.getElementById(`${prefix}-radar`),{
        type:'radar',
        data:{labels,datasets},
        options:{animation:anim,
            scales:{r:{min:0,max:5,
                ticks:{display:true,stepSize:1,showLabelBackdrop:false,color:'#9ca3af',font:{size:9}},
                grid:{color:'#e5e7eb'},pointLabels:{font:{size:10}}}},
            plugins:{legend:{display:datasets.length>1,position:'bottom',
                labels:{boxWidth:12,font:{size:10}}}}}
    });

    document.getElementById(`${prefix}-bar`).innerHTML = barList(scoresObj);
}

// 영역별 점수 막대 — 값 라벨을 항상 붙여 색에 의존하지 않게 한다
function barList(scoresObj) {
    const sorted = DATA.areas.map(a=>({name:a.name, s:scoresObj[a.id]||0})).sort((a,b)=>a.s-b.s);
    return `<div class="bar-list">
        ${sorted.map(d=>`
        <div class="bar-row">
            <span class="bar-name">${d.name}</span>
            <span class="bar-track"><i class="bar-fill" style="width:${d.s/5*100}%;background:${BAR_RAMP[d.s]||'#e5e7eb'}"></i></span>
            <b class="bar-val">${d.s}점</b>
        </div>`).join('')}
        <p class="bar-cap">0~5점 척도</p>
    </div>`;
}

// 영역별 상세 진단 머리글에 넣는 소형 막대
function miniBar(s) {
    return `<span class="bar-track" style="width:88px;flex:none"><i class="bar-fill" style="width:${(s||0)/5*100}%;background:${BAR_RAMP[s]||'#e5e7eb'}"></i></span>`;
}

// Firestore에는 개인정보를 저장하지 않으므로, 담당자가 보관할 사본은 이 파일로 남긴다.
function exportExpertResult() {
    const data = JSON.stringify({
        info: state.info,
        expertName: state.expertName,
        track: state.track,
        scores: state.scores,
        causes: state.causes,
        comments: state.comments,
        solutions: state.solutions,
        roadmap: { short: state.roadmap.short, mid: state.roadmap.mid, long: state.roadmap.long },
        opinion: state.opinion,
        grade: state.grade,
        selfRef: state.selfRef,
        selfScores: state.selfScores,
        exportedAt: new Date().toISOString()
    }, null, 2);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], {type:'application/json'}));
    a.download = `전문가진단_${state.info.comp||'결과'}_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
}

function printExpertReport() {
    const i=state.info;
    const g=state.grade;
    document.getElementById('rpt-info').innerHTML=
        `<tr class="border-b"><th class="text-left py-2 bg-gray-50 px-3 text-xs font-bold w-24">기업명</th><td class="px-3 text-sm">${i.comp}</td><th class="text-left bg-gray-50 px-3 text-xs font-bold w-24">대표자</th><td class="px-3 text-sm">${i.ceo||'-'}</td></tr>
         <tr class="border-b"><th class="text-left py-2 bg-gray-50 px-3 text-xs font-bold">종업원수</th><td class="px-3 text-sm">${i.emp||'-'}</td><th class="text-left bg-gray-50 px-3 text-xs font-bold">사업자번호</th><td class="px-3 text-sm">${i.biz||'-'}</td></tr>
         <tr class="border-b"><th class="text-left py-2 bg-gray-50 px-3 text-xs font-bold">기업유형</th><td class="px-3 text-sm" colspan="3">Track ${state.track} · ${DATA.tracks[state.track]?.title||''}</td></tr>
         <tr class="border-b"><th class="text-left py-2 bg-gray-50 px-3 text-xs font-bold">진단일</th><td class="px-3 text-sm">${new Date().toLocaleDateString('ko-KR')}</td><th class="text-left bg-gray-50 px-3 text-xs font-bold">진단자</th><td class="px-3 text-sm font-bold">${state.expertName||'-'}</td></tr>`;
    document.getElementById('rpt-comment').innerText=state.opinion;   // 등급은 게이지 섹션에 표시한다
    const allById={};
    DATA.areas.forEach(a=>DATA.solutions[a.id].forEach(s=>allById[s.id]=s));
    const phL={short:'단기 (3개월)',mid:'중기 (6개월)',long:'장기 (1년+)'};
    const phC={short:'green',mid:'blue',long:'purple'};
    document.getElementById('rpt-roadmap').innerHTML=['short','mid','long'].map(ph=>`
        <div class="border-t-4 border-${phC[ph]}-400 rounded-lg p-4">
            <h4 class="font-bold text-${phC[ph]}-700 text-sm mb-3">${phL[ph]}</h4>
            ${(state.roadmap[ph]||[]).map(id=>{const s=allById[id];if(!s)return'';
                return `<div class="text-xs border rounded p-2 mb-2 bg-${phC[ph]}-50">
                    <span class="font-bold">${s.name}</span> <span class="text-gray-500">· ${s.budget}</span></div>`;
            }).join('')||'<p class="text-xs text-gray-300">항목 없음</p>'}
        </div>`).join('');
    // 취약 3개 영역에 대해 무엇을·왜·얼마에 도입해야 하는지까지 적는다 (phL은 위 로드맵에서 선언)
    const weak=DATA.areas.map(a=>({id:a.id,name:a.name,icon:a.icon,s:g.scores[a.id]||0})).sort((a,b)=>a.s-b.s).slice(0,3);
    document.getElementById('rpt-rfp').innerHTML=weak.map((w,i)=>{
        const sel=(state.solutions[w.id]||[]).map(id=>DATA.solutions[w.id].find(s=>s.id===id)).filter(Boolean);
        const sols=sel.length?sel:[DATA.solutions[w.id][0]].filter(Boolean);
        const cz=(state.causes[w.id]||[]).join(' · ');
        return `
        <div class="border rounded-lg p-4" style="break-inside:avoid">
            <div class="flex items-center gap-2 mb-2">
                <span class="bg-gray-800 text-white text-xs px-2 py-0.5 rounded font-bold">과제 ${i+1}</span>
                <span class="font-bold text-gray-800">${w.icon} ${w.name}</span>
                <span class="text-xs text-gray-400">현재 ${w.s}점 / 5점</span>
            </div>
            ${cz?`<p class="text-xs text-gray-500 mb-2">도입 사유 — ${cz}</p>`:''}
            ${sols.map(s=>`
                <div class="border-l-2 border-red-300 pl-3 mb-2">
                    <div class="text-sm"><b>${s.name}</b>
                        <span class="text-xs text-gray-500 ml-1">${phL[s.phase]}</span>
                        <span class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded ml-1">💰 ${s.budget}</span></div>
                    <div class="text-xs text-gray-500 mt-0.5">${s.desc}</div>
                </div>`).join('')}
        </div>`;
    }).join('');

    document.getElementById('rpt-overview-wrap').innerHTML = overviewSection();
    document.getElementById('rpt-gauge-wrap').innerHTML    = gaugeSection(g);
    document.getElementById('rpt-strength-wrap').innerHTML = strengthSection(g);
    document.getElementById('rpt-compare-wrap').innerHTML  = compareSection(g);
    document.getElementById('rpt-detail-wrap').innerHTML   = detailSection(g);
    document.getElementById('rpt-photos-wrap').innerHTML   = photosSection();

    // 다이얼로그를 먼저 열어야 캔버스에 크기가 생긴다.
    // 숨긴 채로 그리면 0x0이 되어 차트가 깨진다.
    document.getElementById('report-dialog').showModal();
    setTimeout(()=>{ drawCharts('rpt', g.scores); }, 150);
}

// 등급 정의 — renderResult()의 점수 구간과 일치해야 한다
const GRADES = [
    {lv:1, name:'기초',   range:'6~9점',   desc:'구두 전달과 수기 기록에 의존하며 기록 체계가 갖춰지지 않은 단계'},
    {lv:2, name:'도입',   range:'10~14점', desc:'수기와 디지털 도구가 혼재하며 부분적으로 기록을 남기기 시작한 단계'},
    {lv:3, name:'정착',   range:'15~19점', desc:'엑셀·메신저를 중심으로 주요 업무가 디지털로 공유되는 단계'},
    {lv:4, name:'고도화', range:'20~24점', desc:'클라우드·협업툴을 적극 활용하며 일부 시스템이 연동된 단계'},
    {lv:5, name:'선도',   range:'25~30점', desc:'ERP·MES 기반으로 데이터에 근거해 의사결정이 이루어지는 단계'}
];

// 현재 등급을 5단계 눈금 위 '위치'로 보여준다. 색이 아닌 위치·기호로 표시해 흑백에서도 읽힌다.
function gaugeSection(g) {
    const total = Object.values(g.scores).reduce((a,b)=>a+b,0);
    const cur = GRADES[g.lv-1];
    return `
    <div id="rpt-gauge" class="mb-6" style="break-inside:avoid">
        <h3 class="font-bold text-lg text-[#14532d] border-l-4 border-[#14532d] pl-3 mb-3">종합 등급 판정</h3>
        <div class="flex gap-1">
            ${GRADES.map(x=>`
            <div class="flex-1 text-center pt-2 border-t-4 ${x.lv===g.lv?'border-[#14532d] bg-gray-50':'border-gray-200'}">
                <div class="text-xs font-bold ${x.lv===g.lv?'text-[#14532d]':'text-gray-300'}">${x.lv===g.lv?'▼ ':''}LV${x.lv}</div>
                <div class="text-xs ${x.lv===g.lv?'font-bold text-gray-800':'text-gray-400'}">${x.name}</div>
                <div class="text-gray-400" style="font-size:10px">${x.range}</div>
            </div>`).join('')}
        </div>
        <p class="text-sm text-gray-700 mt-3 leading-relaxed">
            <b class="text-[#14532d]">LV${g.lv}. ${cur.name} (${total}점 / 30점)</b> — ${cur.desc}
        </p>
    </div>`;
}

// 강점·취약을 글자로도 남긴다. 막대 색만으로는 흑백 인쇄에서 구분되지 않는다.
function strengthSection(g) {
    const arr = DATA.areas.map(a=>({name:a.name, icon:a.icon, s:g.scores[a.id]||0}));
    const weak   = arr.filter(x=>x.s<=2).sort((a,b)=>a.s-b.s);
    const strong = arr.filter(x=>x.s>=4).sort((a,b)=>b.s-a.s);
    const cell = (title, items, empty) => `
        <div class="w-[49%] border rounded-lg p-4">
            <p class="text-xs font-bold text-gray-500 mb-2">${title}</p>
            ${items.length ? items.map(x=>`
                <div class="text-sm text-gray-800 mb-1">${x.icon} ${x.name} <span class="text-gray-400">${x.s}점</span></div>`).join('')
              : `<p class="text-sm text-gray-300">${empty}</p>`}
        </div>`;
    return `
    <div id="rpt-strength" class="flex justify-between mb-6" style="break-inside:avoid">
        ${cell('취약 영역 (2점 이하)', weak, '해당 없음')}
        ${cell('강점 영역 (4점 이상)', strong, '해당 없음')}
    </div>`;
}

// 자가진단(사장님)과 전문가 평가의 격차 — 이 사업의 핵심 근거 자료
function compareSection(g) {
    if (!state.selfScores) return '';
    const rows = DATA.areas.map(a => {
        const self = state.selfScores[a.id];
        const exp  = g.scores[a.id];
        if (self == null || exp == null) return '';
        const gap = exp - self;
        const cls = gap < 0 ? 'text-red-600' : gap > 0 ? 'text-blue-600' : 'text-gray-400';
        const txt = gap === 0 ? '일치' : (gap > 0 ? `+${gap}` : `${gap}`);
        return `<tr class="border-b">
            <td class="py-2 px-3 text-sm">${a.icon} ${a.name}</td>
            <td class="py-2 px-3 text-sm text-center">${self}점</td>
            <td class="py-2 px-3 text-sm text-center font-bold">${exp}점</td>
            <td class="py-2 px-3 text-sm text-center font-bold ${cls}">${txt}</td>
        </tr>`;
    }).join('');
    if (!rows) return '';
    return `
    <div id="rpt-compare" class="mb-6" style="break-inside:avoid">
        <h3 class="font-bold text-lg text-[#14532d] border-l-4 border-blue-500 pl-3 mb-3">자가진단 대비 전문가 평가</h3>
        <table class="w-full border-t-2 border-gray-800">
            <thead><tr class="bg-gray-50">
                <th class="text-left py-2 px-3 text-xs font-bold">영역</th>
                <th class="py-2 px-3 text-xs font-bold">자가진단</th>
                <th class="py-2 px-3 text-xs font-bold">전문가 평가</th>
                <th class="py-2 px-3 text-xs font-bold">격차</th>
            </tr></thead>
            <tbody>${rows}</tbody>
        </table>
        <p class="text-xs text-gray-400 mt-2">※ 격차가 음수인 영역은 기업이 실제보다 높게 인식하고 있는 부분으로, 인식 개선이 함께 필요합니다.</p>
    </div>`;
}

// 진단 방법·영역·척도를 앞에 밝힌다. 보고서를 처음 받는 사람이 점수를 해석할 수 있어야 한다.
function overviewSection() {
    const scale = DATA.expertOpts.map(o => `${o.val}점 ${o.text}`).join(' · ');
    return `
    <div id="rpt-overview" class="mb-6" style="break-inside:avoid">
        <h3 class="font-bold text-lg text-[#14532d] border-l-4 border-gray-400 pl-3 mb-3">진단 개요</h3>
        <div class="border rounded-lg p-4 text-sm text-gray-700 leading-relaxed">
            <p class="mb-2">전문가가 현장을 방문하여 대표자·실무자 면담과 작업 현장 관찰을 통해
            아래 6개 영역을 각각 5점 척도로 평가하였습니다.</p>
            <p class="mb-2"><b>진단 영역</b> — ${DATA.areas.map(a=>`${a.icon} ${a.name}`).join(' · ')}</p>
            <p class="mb-2"><b>평가 척도</b> — ${scale}</p>
            <p class="text-xs text-gray-500">※ DX 리더십은 대표자의 추진 의지를 기준으로
            ${DATA.leaderOpts.map(o=>`${o.val}점 ${o.text}`).join(' · ')} 척도를 적용합니다.</p>
        </div>
    </div>`;
}

// 영역별 상세 진단 — 점수·척도 문구·근본원인·전문가 코멘트·권고 솔루션을 한 묶음으로 보인다.
// 흩어져 있으면 "이 공장의 작업지시가 어떤 상태인지"를 읽어낼 수 없다.
function detailSection(g) {
    const phL = {short:'단기', mid:'중기', long:'장기'};
    const blocks = DATA.areas.map(a => {
        const sc   = g.scores[a.id];
        const opts = a.id === 'leader' ? DATA.leaderOpts : DATA.expertOpts;
        const lvl  = (opts.find(o => o.val === sc) || {}).text || '-';
        const cz   = state.causes[a.id]   || [];
        const cmt  = (state.comments[a.id] || '').trim();
        const sols = (state.solutions[a.id] || [])
            .map(id => DATA.solutions[a.id].find(s => s.id === id)).filter(Boolean);
        return `
        <div class="border rounded-lg mb-4" style="break-inside:avoid">
            <div class="flex items-center gap-3 px-4 py-2 bg-gray-50 border-b">
                <span class="font-bold text-gray-800">${a.icon} ${a.name}</span>
                ${miniBar(sc)}
                <span class="text-sm whitespace-nowrap"><b class="text-[#14532d]">${sc != null ? sc : '-'}점</b><span class="text-gray-400"> / 5점</span></span>
            </div>
            <div class="px-4 py-3 text-sm space-y-2">
                <div><span class="text-gray-400 text-xs mr-2">진단 문항</span>${DATA.questions[a.id][state.track] || '-'}</div>
                <div><span class="text-gray-400 text-xs mr-2">현재 수준</span><b>${lvl}</b></div>
                ${cz.length ? `<div><span class="text-gray-400 text-xs mr-2">근본 원인</span><span class="text-orange-800">${cz.join(' · ')}</span></div>` : ''}
                ${cmt ? `<div class="bg-green-50 border border-green-100 rounded p-2 leading-relaxed">
                    <span class="text-green-700 text-xs font-bold mr-2">전문가 코멘트</span>${cmt.replace(/</g,'&lt;').replace(/\n/g,'<br>')}</div>` : ''}
                ${sols.length ? `<div>
                    <span class="text-gray-400 text-xs">권고 솔루션</span>
                    ${sols.map(s=>`<div class="mt-1 pl-3 border-l-2 border-green-300">
                        <b>${s.name}</b> <span class="text-xs text-gray-500">[${phL[s.phase]}]</span>
                        <span class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded ml-1">💰 ${s.budget}</span>
                        <div class="text-xs text-gray-500 mt-0.5">${s.desc}</div>
                    </div>`).join('')}</div>` : ''}
            </div>
        </div>`;
    }).join('');
    return `
    <div id="rpt-detail" class="mb-6">
        <h3 class="font-bold text-lg text-[#14532d] border-l-4 border-orange-500 pl-3 mb-3">영역별 상세 진단</h3>
        ${blocks}
    </div>`;
}

function photosSection() {
    const labels = {1:'현장 전경', 2:'주요 애로사항'};
    if (state.reopened && !state.photos[1] && !state.photos[2]) {
        // 다시 발행한 보고서임을 지면에 남긴다. 사진이 왜 없는지 읽는 사람이 알아야 한다.
        return `
    <div id="rpt-photos" class="mb-6" style="break-inside:avoid">
        <h3 class="font-bold text-lg text-[#14532d] border-l-4 border-gray-400 pl-3 mb-3">현장 사진</h3>
        <p class="text-sm text-gray-500 border rounded-lg p-4">
            ※ 이 보고서는 저장된 진단 결과를 다시 발행한 것으로, 현장 사진은 포함되지 않습니다.
        </p>
    </div>`;
    }
    const imgs = [1,2].filter(n => state.photos[n]).map(n => `
        <div class="w-[49%]">
            <p class="text-xs font-bold text-gray-500 mb-1">${labels[n]}</p>
            <img src="${state.photos[n]}" style="width:100%;border:1px solid #e5e7eb;border-radius:6px;">
        </div>`).join('');
    if (!imgs) return '';
    return `
    <div id="rpt-photos" class="mb-6" style="break-inside:avoid">
        <h3 class="font-bold text-lg text-[#14532d] border-l-4 border-gray-400 pl-3 mb-3">현장 사진</h3>
        <div class="flex justify-between">${imgs}</div>
    </div>`;
}

// 캔버스는 인쇄 시 비어 나오는 경우가 있어 이미지로 바꾼 뒤 인쇄한다.
// 막대는 HTML이라 이 처리가 필요 없다 — 레이더만 대상이다.
function savePDF() {
    const c=document.getElementById('rpt-radar');
    if(c && c.style.display!=='none'){
        const img=new Image();
        img.src=c.toDataURL('image/png');
        img.style.width='100%'; img.style.height='100%';
        c.style.display='none';
        c.parentNode.appendChild(img);
    }
    window.print();
    setTimeout(()=>{
        if(!c)return;
        c.style.display='';
        c.parentNode.querySelectorAll('img').forEach(img=>img.remove());
    },500);
}

// 진단자 로그인 통과 후에만 render() 호출 — checkPw() 참조
// 진단자 이름은 기기에 남겨 다음 기업 진단 때 다시 입력하지 않게 한다.
(function () {
    let saved = '';
    try { saved = localStorage.getItem(EXPERT_NAME_KEY) || ''; } catch(e) {}
    if (saved) {
        document.getElementById('expert-name').value = saved;
        document.getElementById('pw-input').focus();
    } else {
        document.getElementById('expert-name').focus();
    }
})();
</script>
